<!doctype html>
<html lang="en" boltz-theme="default" style="height: 100%">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <link
            rel="icon"
            type="image/svg+xml"
            href="${assetsPath}/favicon.svg" />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="${assetsPath}/apple-touch-icon.png" />
        <link rel="manifest" href="${assetsPath}/manifest.json" />

        <!-- Open Graph -->
        <meta property="og:title" content="${boltzTitle}" />
        <meta property="og:description" content="${boltzDescription}" />
        <meta property="og:url" content="${boltzUrl}" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="${boltzTitle}" />
        <meta property="og:image" content="${boltzUrl}/swaps-preview.png" />
        <meta property="og:image:type" content="image/png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />

        <!-- Twitter -->
        <meta name="twitter:title" content="${boltzTitle}" />
        <meta name="twitter:description" content="${boltzDescription}" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:image" content="${boltzUrl}/swaps-preview.png" />
        <meta name="twitter:site" content="@ZeusLN" />

        <meta name="description" content="${boltzDescription}" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="robots" content="noindex,nofollow" />

        <title>${boltzTitle}</title>
        <style>
            :root {
                --backgroundColor: $backgroundColor;
            }
            @keyframes zoomAnimation {
                0% {
                    transform: translate(-50%, -50%) scale(1);
                }
                50% {
                    transform: translate(-50%, -50%) scale(1.1);
                }
                100% {
                    transform: translate(-50%, -50%) scale(1);
                }
            }
            body > svg {
                display: none;
            }
            .loading {
                background: var(--backgroundColor);
            }
            .loading > svg {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                display: block;
                animation: zoomAnimation 12s infinite;
            }
        </style>
    </head>
    <body class="loading">
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <svg
            id="Layer_2"
            data-name="Layer 2"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 258.12 100">
            <defs>
                <style>
                    .cls-1 {
                        fill: #ffa900;
                        stroke-width: 0px;
                    }
                </style>
            </defs>
            <g id="Layer_1-2" data-name="Layer 1">
                <path
                    class="cls-1"
                    d="m13.83,27.6L0,0h46.47C29.48,4.39,19.86,16.16,13.83,27.6Zm12.86,72.4h46.47l-13.83-27.6c-6.03,11.43-15.65,23.21-32.64,27.6ZM50.12,0L0,100h23.05L73.17,0h-23.05Zm59.33,27.59L123.28,0h-46.47c16.99,4.39,26.62,16.16,32.64,27.6Zm-32.64,72.4h46.47l-13.83-27.6c-6.03,11.43-15.65,23.21-32.64,27.6Zm-3.14-89.97l-11.52,22.98,8.51,16.99-8.51,16.98,11.52,22.98,20.03-39.96-20.03-39.97ZM179.43.01h-23.05s25.06,49.99,25.06,49.99l-25.06,50h23.04l25.06-50L179.43.01Zm-75.68,49.99l25.06,50h23.04s-25.06-50-25.06-50L151.85,0h-23.04s-25.06,50-25.06,50Zm140.53-22.4L258.12,0h-46.47c16.99,4.39,26.62,16.16,32.64,27.6Zm-45.5,44.81l-13.83,27.6h46.47c-16.99-4.39-26.62-16.16-32.64-27.6ZM184.95,0l50.12,100h23.05S208.01.01,208.01.01h-23.06Z" />
            </g>
        </svg>
        <div id="root"></div>
        <script>
            if (!window.isSecureContext) {
                console.error(
                    "Error: This site requires a secure context (HTTPS) to function.",
                );

                document.body.classList.remove("loading");
                document.body.innerHTML = "";
                document.body.style.cssText = `
                    margin: 0;
                    padding: 0;
                    min-height: 100vh;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    background: var(--backgroundColor);
                    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
                `;

                const errorContainer = document.createElement("div");
                errorContainer.style.cssText = `
                    max-width: 600px;
                    padding: 48px 32px;
                    text-align: center;
                    color: white;
                `;

                errorContainer.innerHTML = `
                    <div style="font-size: 64px; margin-bottom: 24px;">🔒</div>
                    <h1 style="font-size: 32px; font-weight: 600; margin: 0 0 16px 0; color: #dc2626;">
                        Secure Connection Required
                    </h1>
                    <p style="font-size: 18px; line-height: 1.6; margin: 0 0 24px 0; color: #e5e7eb;">
                        This site requires a secure context (HTTPS) to function.
                    </p>
                    <p style="font-size: 14px; line-height: 1.6; margin: 0; color: #9ca3af;">
                        Please access this site via HTTPS or localhost.
                    </p>
                `;

                document.body.appendChild(errorContainer);

                throw new Error(
                    "Insecure context - blocking app initialization",
                );
            }
        </script>
        <script src="/src/index.tsx" type="module"></script>
        <script type="application/ld+json">
            ${ldJson}
        </script>
    </body>
</html>

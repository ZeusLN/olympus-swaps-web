<!doctype html>
<html lang="en" boltz-theme="default" style="height: 100%">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <link
            rel="icon"
            type="image/svg+xml"
            href="${assetsPath}/favicon.svg" />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="${assetsPath}/apple-touch-icon.png" />
        <link rel="manifest" href="${assetsPath}/manifest.json" />

        <!-- Open Graph -->
        <meta property="og:title" content="${boltzTitle}" />
        <meta property="og:description" content="${boltzDescription}" />
        <meta property="og:url" content="${boltzUrl}" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="${boltzTitle}" />
        <meta property="og:image" content="${boltzUrl}/swaps-preview.png" />
        <meta property="og:image:type" content="image/png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />

        <!-- Twitter -->
        <meta name="twitter:title" content="${boltzTitle}" />
        <meta name="twitter:description" content="${boltzDescription}" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:image" content="${boltzUrl}/swaps-preview.png" />
        <meta name="twitter:site" content="@ZeusLN" />

        <meta name="description" content="${boltzDescription}" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="robots" content="noindex,nofollow" />

        <title>${boltzTitle}</title>
        <style>
            :root {
                --backgroundColor: $backgroundColor;
            }
            .loading {
                background: var(--backgroundColor);
            }
            #loading-overlay {
                position: fixed;
                inset: 0;
                z-index: 9999;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--backgroundColor);
                opacity: 1;
                transition: opacity 0.4s ease-out;
            }
            #loading-overlay[hidden] {
                display: none;
            }
            #loading-overlay.fade-out {
                opacity: 0;
                pointer-events: none;
            }
            #loading-lottie {
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body class="loading">
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="loading-overlay" aria-hidden="true" hidden>
            <div id="loading-lottie"></div>
        </div>
        <script defer src="${assetsPath}/vendor/lottie-light.min.js"></script>
        <script defer src="${assetsPath}/loading-animation.js"></script>
        <div id="root"></div>
        <div class="background"></div>
        <script>
            if (!window.isSecureContext) {
                console.error(
                    "Error: This site requires a secure context (HTTPS) to function.",
                );

                document.body.classList.remove("loading");
                document.body.innerHTML = "";
                document.body.style.cssText = `
                    margin: 0;
                    padding: 0;
                    min-height: 100vh;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    background: var(--backgroundColor);
                    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
                `;

                const errorContainer = document.createElement("div");
                errorContainer.style.cssText = `
                    max-width: 600px;
                    padding: 48px 32px;
                    text-align: center;
                    color: white;
                `;

                errorContainer.innerHTML = `
                    <div style="font-size: 64px; margin-bottom: 24px;">🔒</div>
                    <h1 style="font-size: 32px; font-weight: 600; margin: 0 0 16px 0; color: #dc2626;">
                        Secure Connection Required
                    </h1>
                    <p style="font-size: 18px; line-height: 1.6; margin: 0 0 24px 0; color: #e5e7eb;">
                        This site requires a secure context (HTTPS) to function.
                    </p>
                    <p style="font-size: 14px; line-height: 1.6; margin: 0; color: #9ca3af;">
                        Please access this site via HTTPS or localhost.
                    </p>
                `;

                document.body.appendChild(errorContainer);

                throw new Error(
                    "Insecure context - blocking app initialization",
                );
            }
        </script>
        <script src="/src/index.tsx" type="module"></script>
        <script type="application/ld+json">
            ${ldJson}
        </script>
    </body>
</html>
